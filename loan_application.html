<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application Form - Trustfund Bank of Sri Lanka</title>
    <link rel="stylesheet" href="form.css">
    <link rel="icon" href="TFBS.ico">
</head>
<body>
    <div class="form-container">
        <h2>Loan Application Form</h2>
        <form id="loanForm" action="loan_application.php" method="post">
            <div class="form-group">
                <label for="fullName">Full Name<sup>*</sup></label>
                <input type="text" id="fullName" name="fullName" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address<sup>*</sup></label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number<sup>*</sup></label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="loanAmount">Loan Amount (in USD)<sup>*</sup></label>
                <input type="number" id="loanAmount" name="loanAmount" required>
            </div>
            <div class="form-group">
                <label for="loanPurpose">Purpose of Loan<sup>*</sup></label>
                <select id="loanPurpose" name="loanPurpose" required>
                    <option value="" disabled selected>Select purpose</option>
                    <option value="personal">Personal</option>
                    <option value="business">Business</option>
                    <option value="education">Education</option>
                    <option value="home">Home Improvement</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="income">Annual Income (in USD)<sup>*</sup></label>
                <input type="number" id="income" name="income" required>
            </div>
            <div class="form-group">
                <label for="employmentStatus">Employment Status<sup>*</sup></label>
                <select id="employmentStatus" name="employmentStatus" required>
                    <option value="" disabled selected>Select status</option>
                    <option value="employed">Employed</option>
                    <option value="self-employed">Self-Employed</option>
                    <option value="unemployed">Unemployed</option>
                    <option value="student">Student</option>
                </select>
            </div>
            <div class="form-group">
                <label for="creditScore">Credit Score<sup>*</sup></label>
                <input type="number" id="creditScore" name="creditScore" required min="300" max="850">
            </div>
            <div class="form-group">
                <label for="loanTerm">Desired Loan Term<sup>*</sup></label>
                <select id="loanTerm" name="loanTerm" required>
                    <option value="" disabled selected>Select term</option>
                    <option value="12">12 months</option>
                    <option value="24">24 months</option>
                    <option value="36">36 months</option>
                    <option value="48">48 months</option>
                </select>
            </div>
            <div class="form-group">
                <button type="submit">Apply Now</button>
            </div>
        </form>
        <div id="formMessage"></div>
    </div>
    <script src="form.js"></script>
</body>
</html>
